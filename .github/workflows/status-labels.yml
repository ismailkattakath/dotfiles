name: status-labels

# Thin caller. Mirrors auto-merge / merge-queue state as PR labels; logic and the
# pull_request_target safety argument live in kattakath/.github/.github/workflows/status-labels.yml.

on:
  pull_request_target:
    types: [auto_merge_enabled, auto_merge_disabled, enqueued, dequeued, closed, reopened, synchronize]

concurrency:
  group: status-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # every run recomputes from live state, so the latest wins

permissions:
  pull-requests: write
  issues: write

jobs:
  sync:
    uses: kattakath/.github/.github/workflows/status-labels.yml@3d5ad5b9e04c853dbb0d82446255c9ef9230332a
